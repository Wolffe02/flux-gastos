name: Build desktop apps
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: python -m pip install cryptography pyinstaller pillow
      - name: Build Flux for Windows
        shell: cmd
        run: >-
          pyinstaller --noconfirm --onefile --console --name Flux
          --icon flux-icon.ico
          --add-data "index.html;."
          --add-data "manifest.webmanifest;."
          --add-data "service-worker.js;."
          --add-data "icons;icons"
          app.py
      - uses: actions/upload-artifact@v4
        with:
          name: flux-windows
          path: dist/Flux.exe
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: python3 -m pip install cryptography pyinstaller
      - name: Create macOS icon
        run: |
          mkdir flux.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" icons/flux-512.png --out "flux.iconset/icon_${size}x${size}.png" >/dev/null
            if [ "$size" -lt 512 ]; then
              doubled=$((size * 2))
              sips -z "$doubled" "$doubled" icons/flux-512.png --out "flux.iconset/icon_${size}x${size}@2x.png" >/dev/null
            fi
          done
          sips -z 1024 1024 icons/flux-512.png --out flux.iconset/icon_512x512@2x.png >/dev/null
          iconutil -c icns flux.iconset -o flux.icns
      - name: Build Flux for macOS
        run: >-
          pyinstaller --noconfirm --windowed --name Flux --icon flux.icns
          --add-data 'index.html:.'
          --add-data 'manifest.webmanifest:.'
          --add-data 'service-worker.js:.'
          --add-data 'icons:icons'
          app.py
      - name: Package app
        run: cd dist && zip -r "$GITHUB_WORKSPACE/Flux-macOS.zip" Flux.app
      - uses: actions/upload-artifact@v4
        with:
          name: flux-macos
          path: Flux-macOS.zip
