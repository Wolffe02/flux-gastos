name: Build mobile apps
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Bundle Flux web app
        run: ./sync-native-web-assets.sh
      - name: Build debug APK
        working-directory: native/android
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: flux-android-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
  ios-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Bundle Flux web app
        run: ./sync-native-web-assets.sh
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec native/ios/project.yml --project native/ios/Flux.xcodeproj
      - name: Build iOS Simulator app
        run: xcodebuild -project native/ios/Flux.xcodeproj -scheme Flux -sdk iphonesimulator -configuration Release -derivedDataPath native/ios/build CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: cd native/ios/build/Build/Products/Release-iphonesimulator && zip -r "$GITHUB_WORKSPACE/Flux-iOS-Simulator.zip" Flux.app
      - uses: actions/upload-artifact@v4
        with:
          name: flux-ios-simulator-preview
          path: Flux-iOS-Simulator.zip
