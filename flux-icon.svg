<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Flux</title>
  <desc id="desc">Una F formada por un flujo luminoso cian con un destello magenta sobre fondo azul noche.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142638"/>
      <stop offset="1" stop-color="#071119"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#25e5c5"/>
      <stop offset=".55" stop-color="#36cfff"/>
      <stop offset="1" stop-color="#718aff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="sparkGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bg)"/>
  <rect x="21" y="21" width="470" height="470" rx="111" fill="none" stroke="#76dfea" stroke-opacity=".15" stroke-width="2"/>
  <path d="M146 360h74c26 0 43-17 43-43V207c0-27 18-45 45-45h59" fill="none" stroke="#24e5c5" stroke-opacity=".23" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M146 360h74c26 0 43-17 43-43V207c0-27 18-45 45-45h59" fill="none" stroke="url(#flow)" stroke-width="31" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M263 259h91" fill="none" stroke="#24e5c5" stroke-opacity=".22" stroke-width="43" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M263 259h91" fill="none" stroke="url(#flow)" stroke-width="29" stroke-linecap="round"/>
  <path d="M391 113l8 20 20 8-20 8-8 20-8-20-20-8 20-8z" fill="#ff53b8" filter="url(#sparkGlow)"/>
  <path d="M391 113l8 20 20 8-20 8-8 20-8-20-20-8 20-8z" fill="#ff78c6"/>
</svg>
